<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#fff1f5"
    >

    <title>
        For Chitrank Bhaiya ❤️
    </title>


    <!-- React -->

    <script
        crossorigin
        src="https://unpkg.com/react@18/umd/react.development.js">
    </script>


    <script
        crossorigin
        src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>


    <!-- Babel -->

    <script
        src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html{
    scroll-behavior:smooth;
}


body{

    font-family:

        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#fff0f5;

    color:#5c3040;

    overflow-x:hidden;

}


/* =========================================================
   MAIN
========================================================= */

.app{

    min-height:100vh;

    overflow:hidden;

    position:relative;

    background:

        radial-gradient(
            circle at 50% 0%,
            #ffffff 0%,
            #fff2f6 25%,
            #ffd9e5 55%,
            #f6b1c5 100%
        );

}


/* =========================================================
   BACKGROUND STARS
========================================================= */

.app::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.4;

    background-image:

        radial-gradient(
            #ffffff 1px,
            transparent 1px
        );

    background-size:32px 32px;

    animation:

        starsMove
        18s linear infinite;

}


@keyframes starsMove{

    from{

        transform:
            translateY(0);

    }

    to{

        transform:
            translateY(32px);

    }

}


/* =========================================================
   HERO
========================================================= */

.hero{

    min-height:100svh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:

        18px
        12px;

    position:relative;

    z-index:2;

}


.hero-card{

    width:100%;

    max-width:700px;

    text-align:center;

    padding:

        45px
        20px
        38px;

    border-radius:32px;

    background:

        rgba(
            255,
            255,
            255,
            .72
        );

    border:

        2px solid
        rgba(
            255,
            255,
            255,
            .85
        );

    box-shadow:

        0 25px 80px
        rgba(
            139,
            54,
            81,
            .18
        );

    backdrop-filter:blur(16px);

    -webkit-backdrop-filter:blur(16px);

    position:relative;

    overflow:hidden;

}


.hero-card::before{

    content:"";

    position:absolute;

    inset:10px;

    border:

        1px dashed
        rgba(
            200,
            72,
            113,
            .25
        );

    border-radius:25px;

    pointer-events:none;

}


/* =========================================================
   RAKHI ICON
========================================================= */

.rakhi-icon{

    font-size:65px;

    display:inline-block;

    animation:

        rakhiFloat
        3s ease-in-out infinite;

}


@keyframes rakhiFloat{

    50%{

        transform:
            translateY(-8px)
            rotate(5deg);

    }

}


/* =========================================================
   SMALL TITLE
========================================================= */

.kicker{

    margin-top:12px;

    font-size:10px;

    font-weight:900;

    letter-spacing:.25em;

    color:#c34f75;

}


/* =========================================================
   MAIN TITLE
========================================================= */

.hero h1{

    margin:

        18px
        0;

    font-family:
        Georgia,
        serif;

    font-size:

        clamp(
            42px,
            12vw,
            75px
        );

    line-height:1;

    color:#a4375d;

    text-shadow:

        0 3px 0 white;

}


.hero-description{

    font-family:
        Georgia,
        serif;

    font-size:

        clamp(
            17px,
            4.5vw,
            21px
        );

    line-height:1.7;

    color:#704251;

}


/* =========================================================
   BUTTONS
========================================================= */

.buttons{

    display:flex;

    flex-direction:column;

    gap:12px;

    max-width:330px;

    margin:

        28px
        auto
        0;

}


.btn{

    width:100%;

    border:none;

    border-radius:999px;

    padding:

        15px
        20px;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    transition:.25s;

    box-shadow:

        0 10px 25px
        rgba(
            170,
            60,
            100,
            .15
        );

}


.btn:active{

    transform:
        scale(.96);

}


.primary{

    color:white;

    background:

        linear-gradient(
            135deg,
            #e93686,
            #c74473
        );

}


.secondary{

    color:#a43c62;

    background:white;

    border:

        1px solid
        #efbfd0;

}


/* =========================================================
   SCROLL
========================================================= */

.scroll-text{

    margin-top:23px;

    font-size:10px;

    letter-spacing:.15em;

    color:#a8667b;

    animation:

        scrollBounce
        1.7s infinite;

}


@keyframes scrollBounce{

    50%{

        transform:
            translateY(5px);

        opacity:.6;

    }

}


/* =========================================================
   SECTIONS
========================================================= */

.section{

    padding:

        75px
        14px;

    position:relative;

    z-index:2;

}


.container{

    width:100%;

    max-width:900px;

    margin:auto;

}


.section-title{

    text-align:center;

    font-family:
        Georgia,
        serif;

    font-size:

        clamp(
            35px,
            9vw,
            55px
        );

    color:#963956;

    line-height:1.1;

}


.section-description{

    text-align:center;

    margin:

        12px
        auto
        30px;

    max-width:600px;

    line-height:1.7;

    color:#805265;

}


/* =========================================================
   LETTER
========================================================= */

.letter{

    background:#fffafb;

    border:

        1px solid
        #f2c7d4;

    border-radius:25px;

    padding:

        30px
        21px;

    box-shadow:

        0 20px 55px
        rgba(
            130,
            42,
            72,
            .12
        );

    animation:

        letterAppear
        .7s ease;

}


@keyframes letterAppear{

    from{

        opacity:0;

        transform:
            translateY(20px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


.letter-top{

    color:#bd4b70;

    font-weight:900;

    letter-spacing:.08em;

    font-size:13px;

}


.letter p{

    margin:

        20px
        0;

    font-family:
        Georgia,
        serif;

    font-size:18px;

    line-height:1.85;

    color:#603746;

}


.signature{

    margin-top:28px;

    text-align:right;

    font-family:
        Georgia,
        serif;

    font-weight:bold;

    font-size:17px;

    color:#a33b60;

}


/* =========================================================
   DIGITAL RAKHI
========================================================= */

.rakhi-section{

    text-align:center;

}


.rakhi{

    width:240px;

    height:240px;

    margin:

        25px
        auto;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:

        .7s;

}


.rakhi.tied{

    transform:

        scale(1.1)
        rotate(3deg);

}


.rakhi-thread{

    position:absolute;

    left:-30px;

    right:-30px;

    height:14px;

    border-radius:30px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #c92566,
            #f16f9b,
            #c92566,
            transparent
        );

}


.rakhi-ring{

    width:155px;

    height:155px;

    border-radius:50%;

    position:absolute;

    border:

        12px solid
        #d72c70;

    box-shadow:

        0 0 0 8px #ffd36d,

        0 0 0 16px #ef78a0,

        0 0 45px
        rgba(
            211,
            45,
            111,
            .3
        );

    animation:

        rakhiGlow
        2s infinite;

}


@keyframes rakhiGlow{

    50%{

        box-shadow:

            0 0 0 8px #ffd36d,

            0 0 0 16px #ef78a0,

            0 0 75px
            rgba(
                211,
                45,
                111,
                .45
            );

    }

}


.rakhi-center{

    width:68px;

    height:68px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #fff1a8 0 18%,
            #ff86ad 20% 58%,
            #b9245c 60%
        );

    z-index:3;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-size:24px;

    box-shadow:

        0 0 25px
        #ffb2c9;

}


/* =========================================================
   RAKHI BEADS
========================================================= */

.bead{

    position:absolute;

    width:13px;

    height:13px;

    border-radius:50%;

    background:#ffd875;

    box-shadow:

        0 0 10px
        #ffcf63;

}


.bead1{

    top:7%;

    left:47%;

}


.bead2{

    top:20%;

    right:17%;

}


.bead3{

    bottom:20%;

    right:17%;

}


.bead4{

    bottom:7%;

    left:47%;

}


.bead5{

    bottom:20%;

    left:17%;

}


.bead6{

    top:20%;

    left:17%;

}


/* =========================================================
   PROMISE CARDS
========================================================= */

.promises{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    margin-top:35px;

}


.promise{

    padding:

        18px
        10px;

    text-align:center;

    background:

        rgba(
            255,
            255,
            255,
            .65
        );

    border-radius:18px;

    border:

        1px solid
        white;

}


.promise strong{

    display:block;

    font-size:13px;

    color:#8e3151;

}


.promise span{

    display:block;

    margin-top:5px;

    font-size:10px;

    color:#a97888;

}


/* =========================================================
   BROTHER CARDS
========================================================= */

.cards{

    display:grid;

    grid-template-columns:
        1fr;

    gap:15px;

}


.card{

    background:

        rgba(
            255,
            255,
            255,
            .7
        );

    border:

        1px solid
        rgba(
            255,
            255,
            255,
            .9
        );

    border-radius:25px;

    padding:25px 20px;

    text-align:center;

    box-shadow:

        0 15px 40px
        rgba(
            125,
            42,
            72,
            .10
        );

    transition:.25s;

}


.card:active{

    transform:
        scale(.98);

}


.card-icon{

    font-size:45px;

}


.card h3{

    margin:

        10px
        0 7px;

    color:#8d3151;

}


.card p{

    color:#906373;

    font-size:14px;

    line-height:1.6;

}


/* =========================================================
   FINAL
========================================================= */

.final{

    min-height:90svh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:

        40px
        15px
        90px;

    position:relative;

    z-index:2;

}


.final-icon{

    font-size:65px;

    animation:

        heartbeat
        1.6s infinite;

}


@keyframes heartbeat{

    50%{

        transform:
            scale(1.15);

    }

}


.final h2{

    margin:

        18px
        0;

    font-family:
        Georgia,
        serif;

    font-size:

        clamp(
            42px,
            11vw,
            75px
        );

    line-height:1.05;

    color:#9a3557;

}


.final p{

    font-family:
        Georgia,
        serif;

    font-size:18px;

    line-height:1.8;

    color:#704251;

}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.float{

    position:fixed;

    bottom:-40px;

    z-index:1;

    pointer-events:none;

    animation:

        floatUp
        linear forwards;

}


@keyframes floatUp{

    from{

        opacity:0;

    }

    10%{

        opacity:.7;

    }

    to{

        transform:
            translateY(-115vh)
            rotate(360deg);

        opacity:0;

    }

}


/* =========================================================
   CONFETTI
========================================================= */

.confetti{

    position:fixed;

    top:-20px;

    width:8px;

    height:14px;

    z-index:100;

    pointer-events:none;

    animation:

        confettiFall
        2.8s
        linear
        forwards;

}


@keyframes confettiFall{

    to{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;

    }

}


/* =========================================================
   MUSIC BUTTON
========================================================= */

.music-button{

    position:fixed;

    right:16px;

    bottom:

        calc(
            16px
            +
            env(
                safe-area-inset-bottom
            )
        );

    z-index:200;

    width:55px;

    height:55px;

    border-radius:50%;

    border:

        1px solid
        #efb7ca;

    background:white;

    color:#a53b61;

    box-shadow:

        0 10px 30px
        rgba(
            168,
            66,
            99,
            .2
        );

    cursor:pointer;

    font-size:21px;

}


.music-button.playing{

    animation:

        musicPulse
        1s infinite;

}


@keyframes musicPulse{

    50%{

        transform:
            scale(1.12);

        box-shadow:

            0 0 30px
            rgba(
                216,
                91,
                135,
                .4
            );

    }

}


/* =========================================================
   MUSIC NOTICE
========================================================= */

.music-note{

    position:fixed;

    bottom:82px;

    right:15px;

    z-index:190;

    background:white;

    padding:

        8px
        12px;

    border-radius:20px;

    font-size:10px;

    color:#a03b60;

    box-shadow:

        0 8px 25px
        rgba(
            120,
            40,
            70,
            .12
        );

    animation:

        fadeNote
        4s
        forwards;

}


@keyframes fadeNote{

    0%{
        opacity:0;
        transform:translateY(10px);
    }

    15%{
        opacity:1;
        transform:translateY(0);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   TABLET / DESKTOP
========================================================= */

@media(min-width:700px){

    .buttons{

        flex-direction:row;

        max-width:650px;

    }


    .btn{

        width:auto;

        min-width:230px;

    }


    .cards{

        grid-template-columns:
            repeat(3,1fr);

    }


    .promises{

        grid-template-columns:
            repeat(4,1fr);

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{

        animation:none!important;

        scroll-behavior:auto!important;

    }

}

</style>

</head>


<body>


<div id="root"></div>


<script type="text/babel">

const {
    useState,
    useEffect
} = React;


/* =========================================================
   FLOATING HEARTS
========================================================= */

function FloatingHearts(){

    const [
        hearts,
        setHearts
    ] = useState([]);


    useEffect(()=>{

        const interval =
            setInterval(()=>{

                setHearts(
                    previous => [

                        ...previous.slice(-15),

                        {

                            id:
                                Date.now()
                                +
                                Math.random(),

                            left:
                                Math.random()*100,

                            duration:
                                6 +
                                Math.random()*7,

                            symbol:
                                [
                                    "❤️",
                                    "♡",
                                    "✦",
                                    "🌸",
                                    "🪷"
                                ][
                                    Math.floor(
                                        Math.random()*5
                                    )
                                ]

                        }

                    ]
                );

            },700);


        return ()=>clearInterval(
            interval
        );

    },[]);


    return (

        <>

            {
                hearts.map(
                    heart => (

                        <span

                            key={heart.id}

                            className="float"

                            style={{

                                left:
                                    heart.left
                                    + "%",

                                animationDuration:
                                    heart.duration
                                    + "s"

                            }}

                        >

                            {heart.symbol}

                        </span>

                    )
                )
            }

        </>

    );

}


/* =========================================================
   CONFETTI
========================================================= */

function Confetti({active}){

    if(!active)
        return null;


    const pieces =
        Array.from(
            {length:80}
        );


    return (

        <>

            {
                pieces.map(
                    (_,index)=>(

                        <span

                            key={index}

                            className="confetti"

                            style={{

                                left:
                                    Math.random()*100
                                    + "%",

                                animationDelay:
                                    Math.random()*.4
                                    + "s",

                                backgroundColor:
                                    [
                                        "#d92e72",
                                        "#ffd36d",
                                        "#ff9fc0",
                                        "#b84a77",
                                        "#ffffff"
                                    ][
                                        index%5
                                    ]

                            }}

                        />

                    )
                )
            }

        </>

    );

}


/* =========================================================
   MUSIC PLAYER
========================================================= */

function MusicPlayer(){

    const [
        playing,
        setPlaying
    ] = useState(false);


    const [
        showMessage,
        setShowMessage
    ] = useState(true);


    const playMusic = ()=>{

        const audio =
            document.getElementById(
                "rakhiAudio"
            );


        if(!audio)
            return;


        if(audio.paused){

            audio.play()
                .then(()=>{

                    setPlaying(true);

                    setShowMessage(false);

                })
                .catch(()=>{

                    alert(
                        "Tap the music button again to start the song ❤️"
                    );

                });

        }

        else{

            audio.pause();

            setPlaying(false);

        }

    };


    return (

        <>

            <audio
                id="rakhiAudio"
                src="rakhi-song.mp3"
                loop
                preload="auto"
            />


            {
                showMessage &&

                <div className="music-note">

                    🎵 Tap ♫ for our song

                </div>
            }


            <button

                className={
                    "music-button "
                    +
                    (
                        playing
                        ? "playing"
                        : ""
                    )
                }

                onClick={playMusic}

                aria-label="Play Raksha Bandhan song"

            >

                {
                    playing
                    ? "❚❚"
                    : "♫"
                }

            </button>

        </>

    );

}


/* =========================================================
   MAIN APP
========================================================= */

function App(){

    const [
        letterOpen,
        setLetterOpen
    ] = useState(false);


    const [
        rakhiTied,
        setRakhiTied
    ] = useState(false);


    const [
        celebration,
        setCelebration
    ] = useState(false);


    /* =====================================================
       CELEBRATE
    ===================================================== */

    const celebrate = ()=>{

        setCelebration(true);


        setTimeout(()=>{

            setCelebration(false);

        },3000);

    };


    /* =====================================================
       SCROLL
    ===================================================== */

    const scrollTo = (id)=>{

        const element =
            document.getElementById(id);


        if(element){

            element.scrollIntoView({

                behavior:"smooth"

            });

        }

    };


    /* =====================================================
       OPEN LETTER
    ===================================================== */

    const openLetter = ()=>{

        setLetterOpen(true);


        setTimeout(()=>{

            scrollTo("letter");

        },100);

    };


    /* =====================================================
       TIE RAKHI
    ===================================================== */

    const tieRakhi = ()=>{

        setRakhiTied(true);

        celebrate();

    };


    return (

        <div className="app">


            <FloatingHearts/>


            <Confetti
                active={celebration}
            />


            {/* =================================================
                HERO
            ================================================= */}

            <section className="hero">

                <div className="hero-card">


                    <div className="rakhi-icon">

                        🪢

                    </div>


                    <div className="kicker">

                        RAKSHA BANDHAN
                        {" • "}
                        A SPECIAL MESSAGE

                    </div>


                    <h1>

                        Dear Chitrank Bhaiya,

                        <br/>

                        this one's for you ❤️

                    </h1>


                    <p className="hero-description">

                        One rakhi.
                        A thousand memories.

                        <br/>

                        And one brother
                        who is impossible
                        to replace. 🫶

                    </p>


                    <div className="buttons">


                        <button

                            className="btn primary"

                            onClick={openLetter}

                        >

                            💌 Open My Letter

                        </button>


                        <button

                            className="btn secondary"

                            onClick={()=>{
                                scrollTo("rakhi");
                            }}

                        >

                            🪢 Tie Your Rakhi

                        </button>


                    </div>


                    <div className="scroll-text">

                        SCROLL FOR YOUR
                        RAKHI SURPRISE ↓

                    </div>


                </div>

            </section>



            {/* =================================================
                LETTER
            ================================================= */}

            <section
                className="section"
                id="letter"
            >

                <div className="container">


                    <h2 className="section-title">

                        A Letter For You 💌

                    </h2>


                    <p className="section-description">

                        Some feelings are too special
                        for just a WhatsApp message.

                    </p>


                    {
                        letterOpen

                        ?

                        <div className="letter">


                            <div className="letter-top">

                                DEAR CHITRANK BHAIYA,

                            </div>


                            <p>

                                Happy Raksha Bandhan
                                to the best brother! ❤️

                            </p>


                            <p>

                                Thank you for always being
                                there — whether I need
                                advice, support, someone
                                to annoy, or simply someone
                                who understands.

                            </p>


                            <p>

                                We may fight over the
                                silliest things, tease each
                                other endlessly, and sometimes
                                drive each other crazy...

                                but at the end of the day,
                                I know I can always count
                                on you.

                            </p>


                            <p>

                                This rakhi is a little reminder
                                that no matter how much
                                we grow up or where life
                                takes us, you'll always be
                                my Bhaiya and I'll always
                                be your little sister.

                            </p>


                            <p>

                                Thank you for protecting me,
                                supporting me, irritating me,
                                making me laugh, and simply
                                being YOU. 🫶

                            </p>


                            <div className="signature">

                                With lots and lots of love,

                                <br/><br/>

                                Kanishka

                                <br/>

                                (Your Little Sister) ❤️

                            </div>


                        </div>

                        :

                        <div
                            style={{
                                textAlign:"center"
                            }}
                        >

                            <button

                                className="btn primary"

                                style={{
                                    maxWidth:"320px"
                                }}

                                onClick={()=>{
                                    setLetterOpen(true);
                                }}

                            >

                                ✨ Reveal My Letter

                            </button>

                        </div>

                    }


                </div>

            </section>



            {/* =================================================
                DIGITAL RAKHI
            ================================================= */}

            <section
                className="section"
                id="rakhi"
            >

                <div className="container">


                    <h2 className="section-title">

                        Your Digital Rakhi 🪢

                    </h2>


                    <p className="section-description">

                        This little rakhi carries
                        a very big promise.

                    </p>


                    <div className="rakhi-section">


                        <div

                            className={
                                "rakhi "
                                +
                                (
                                    rakhiTied
                                    ? "tied"
                                    : ""
                                )
                            }

                        >


                            <div className="rakhi-thread">
                            </div>


                            <div className="rakhi-ring">
                            </div>


                            <div className="rakhi-center">

                                ✦

                            </div>


                            <span
                                className="bead bead1"
                            />

                            <span
                                className="bead bead2"
                            />

                            <span
                                className="bead bead3"
                            />

                            <span
                                className="bead bead4"
                            />

                            <span
                                className="bead bead5"
                            />

                            <span
                                className="bead bead6"
                            />


                        </div>


                        <button

                            className="btn primary"

                            style={{
                                maxWidth:"330px"
                            }}

                            onClick={tieRakhi}

                        >

                            {

                                rakhiTied

                                ?

                                "❤️ Rakhi Tied!"

                                :

                                "🪢 Tie Rakhi On Bhaiya"

                            }

                        </button>


                        {

                            rakhiTied &&

                            <p

                                style={{
                                    marginTop:"16px",
                                    color:"#a33b60",
                                    fontWeight:"800"
                                }}

                            >

                                Promise sealed.
                                Bhai-behen bond = FOREVER. ♾️❤️

                            </p>

                        }


                    </div>


                    <div className="promises">


                        <div className="promise">

                            <strong>

                                🛡️ Protection

                            </strong>

                            <span>

                                Always

                            </span>

                        </div>


                        <div className="promise">

                            <strong>

                                😂 Teasing

                            </strong>

                            <span>

                                Unlimited

                            </span>

                        </div>


                        <div className="promise">

                            <strong>

                                🤝 Support

                            </strong>

                            <span>

                                Forever

                            </span>

                        </div>


                        <div className="promise">

                            <strong>

                                ❤️ Love

                            </strong>

                            <span>

                                Infinite

                            </span>

                        </div>


                    </div>


                </div>

            </section>



            {/* =================================================
                BROTHER RESPONSIBILITIES
            ================================================= */}

            <section className="section">


                <div className="container">


                    <h2 className="section-title">

                        Bhaiya's Official Duties 😎

                    </h2>


                    <p className="section-description">

                        Important responsibilities
                        that come with being my
                        big brother.

                    </p>


                    <div className="cards">


                        <div className="card">

                            <div className="card-icon">

                                🛡️

                            </div>


                            <h3>

                                Chief Protector

                            </h3>


                            <p>

                                Protect your little sister
                                from everything...

                                even from her own
                                questionable decisions. 😂

                            </p>

                        </div>



                        <div className="card">

                            <div className="card-icon">

                                😂

                            </div>


                            <h3>

                                Professional Teaser

                            </h3>


                            <p>

                                Tease me whenever possible,
                                but don't let anyone else
                                do it.

                            </p>

                        </div>



                        <div className="card">

                            <div className="card-icon">

                                🤗

                            </div>


                            <h3>

                                Forever Support

                            </h3>


                            <p>

                                Always be the person
                                I can call when life
                                gets difficult.

                            </p>

                        </div>


                    </div>


                </div>


            </section>



            {/* =================================================
                FINAL
            ================================================= */}

            <section className="final">


                <div>


                    <div className="final-icon">

                        🪢

                    </div>


                    <div className="kicker">

                        ONE LAST MESSAGE

                    </div>


                    <h2>

                        Happy Raksha Bandhan,
                        Chitrank Bhaiya! ❤️

                    </h2>


                    <p>

                        No matter how much we grow up,

                        <br/>

                        you'll always be my Bhaiya
                        and I'll always be your
                        little sister.

                        🫶

                    </p>


                    <div className="buttons">


                        <button

                            className="btn primary"

                            onClick={celebrate}

                        >

                            🎉 Celebrate Our Bond

                        </button>


                        <button

                            className="btn secondary"

                            onClick={()=>{
                                scrollTo("letter");
                            }}

                        >

                            💌 Read My Letter Again

                        </button>


                    </div>


                    <p
                        style={{
                            marginTop:"25px",
                            fontSize:"12px",
                            color:"#a36a7d"
                        }}
                    >

                        Made with love by
                        Kanishka ❤️

                    </p>


                </div>


            </section>



            {/* MUSIC */}

            <MusicPlayer/>


        </div>

    );

}


/* =========================================================
   START APP
========================================================= */

ReactDOM

    .createRoot(
        document.getElementById("root")
    )

    .render(
        <App/>
    );

</script>


</body>

</html>
